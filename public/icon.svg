<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#f59e0b" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Icon Group inside safe-zone -->
  <g transform="translate(96, 96)" filter="url(#shadow)">
    <!-- House Roof -->
    <path d="M160 28 L28 140 C20 147 24 160 35 160 H60 V280 C60 291 69 300 80 300 H240 C251 300 260 291 260 280 V160 H285 C296 160 300 147 292 140 Z" fill="url(#goldGrad)"/>
    
    <!-- Chimney -->
    <path d="M210 65 V110 L240 135 V65 H210 Z" fill="#d97706"/>

    <!-- Door / Real Estate Keyhole Accent -->
    <rect x="125" y="190" width="70" height="110" rx="10" fill="#0f172a"/>
    <circle cx="160" cy="225" r="14" fill="#fbbf24"/>
    <path d="M156 225 L152 265 H168 L164 225 Z" fill="#fbbf24"/>

    <!-- Window Accent -->
    <rect x="90" y="150" width="40" height="40" rx="6" fill="#0f172a"/>
    <rect x="190" y="150" width="40" height="40" rx="6" fill="#0f172a"/>
  </g>
</svg>
