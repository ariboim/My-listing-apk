name: Publish Android APK Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build and Publish Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Web Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Bundle Web Assets into Android App
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r dist/* android/app/src/main/assets/www/

      - name: Compile Android Debug APK
        working-directory: android
        run: |
          if command -v gradle &> /dev/null; then
            gradle :app:assembleDebug --no-daemon --stacktrace
          else
            chmod +x ./gradlew 2>/dev/null || true
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: Validate Compiled APK
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: Compiled APK not found at $APK_PATH"
            exit 1
          fi

          if [ ! -s "$APK_PATH" ]; then
            echo "Error: Compiled APK is empty"
            exit 1
          fi

          unzip -tq "$APK_PATH"
          echo "APK archive validation passed successfully."

      - name: Prepare APK Distribution
        run: |
          mkdir -p apk-distribution
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-distribution/app-debug.apk
          cd apk-distribution
          sha256sum app-debug.apk > app-debug.apk.sha256
          sha256sum -c app-debug.apk.sha256

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="release-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="My Listing APK v1.0.${{ github.run_number }}"
          REPO="${{ github.repository }}"
          APK_SIZE=$(du -h apk-distribution/app-debug.apk | cut -f1)
          CHECKSUM=$(awk '{print $1}' apk-distribution/app-debug.apk.sha256)

          gh release create "$TAG_NAME" \
            apk-distribution/app-debug.apk \
            apk-distribution/app-debug.apk.sha256 \
            --title "$RELEASE_TITLE" \
            --notes "### My Listing - Android Debug APK Release
            
- **Release Tag**: \`$TAG_NAME\`
- **APK Filename**: \`app-debug.apk\`
- **APK Size**: $APK_SIZE
- **SHA-256**: \`$CHECKSUM\`
- **Direct Download**: https://github.com/$REPO/releases/latest/download/app-debug.apk" \
            --latest

          echo "### APK BUILD & RELEASE SUCCESSFUL" >> $GITHUB_STEP_SUMMARY
          echo "- **Application**: My Listing - Arsip Properti Agen" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Tag**: \`$TAG_NAME\`" >> $GITHUB_STEP_SUMMARY
          echo "- **APK Size**: $APK_SIZE" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA-256**: \`$CHECKSUM\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Page**: https://github.com/$REPO/releases/tag/$TAG_NAME" >> $GITHUB_STEP_SUMMARY
          echo "- **Direct Download URL**: https://github.com/$REPO/releases/latest/download/app-debug.apk" >> $GITHUB_STEP_SUMMARY
